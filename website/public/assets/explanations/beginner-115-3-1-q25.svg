  <text x="108" y="194" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="600" fill="#a4421a">標準答案 C</text>
  <text x="80" y="275" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="600" fill="#35404b">交叉驗證：把資料分成幾份，輪流留一份評估，其餘用來訓練。</text>
  <text x="80" y="335" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="22" fill="#52606d">本題是 5 折：每輪 4 份訓練、1 份評估；輪完 5 次後取平均。</text>
  <rect x="80" y="380" width="1040" height="570" rx="24" fill="#f5f7f9"/>
  <text x="120" y="435" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="600" fill="#35404b">每一欄代表一輪；橘色那份輪流當評估資料。</text>
