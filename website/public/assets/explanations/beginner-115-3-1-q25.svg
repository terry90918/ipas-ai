  <text x="80" y="1010" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="600" fill="#35404b">生活比喻：把題庫分成五包，輪流用四包練習、一包測驗；最後平均五次成績。</text>
  <text x="80" y="1090" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="700" fill="#17212b">其他選項差在哪裡</text>
  <text x="90" y="1150" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="600" fill="#24313d">A　隨機森林是用來預測的模型演算法，不是資料評估切法。</text>
  <text x="90" y="1210" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="600" fill="#24313d">B　保留法通常只切一次固定的訓練集與測試集，沒有輪流五次。</text>
  <text x="90" y="1270" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="600" fill="#24313d">D　自助抽樣會「有放回」抽資料，樣本可能重複；不是五份輪替。</text>
  <rect x="80" y="1340" width="1040" height="160" rx="22" fill="#17212b"/>
  <text x="600" y="1400" text-anchor="middle" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="600" fill="#ffffff">交叉驗證：多次切分、輪流評估、最後取平均</text>
  <text x="600" y="1450" text-anchor="middle" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="22" fill="#ffffff">題目出現「分成 k 份、輪流留一份、重複 k 次」就想到它。</text>
